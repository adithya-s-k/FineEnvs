[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-latex_ocr_env"
version = "0.1.0"
description = "LaTeX OCR environment for OpenEnv (image -> LaTeX transcription with edit-distance reward)"
requires-python = ">=3.11"
dependencies = [
    # Core OpenEnv runtime (FastAPI server + Task API). 0.4.1 is the first
    # release that ships the Task API (#726).
    "openenv==0.4.2",
    "datasets>=4.0.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "gradio>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    # OpenAI SDK is only needed to drive the env with a VLM policy (validate.py).
    "openai>=1.40.0",
]

train = [
    "trl==1.12.0",
    "transformers>=5.2,<6",
    "peft>=0.18,<1",
    "trackio>=0.18,<1",
    "torch>=2.7,<3",
    "accelerate>=1.4,<2",
]

[project.scripts]
latex-ocr-server = "latex_ocr_env.server.app:main"
latex-ocr-smoke = "latex_ocr_env.smoke:main"

[tool.setuptools]
include-package-data = true
packages = ["latex_ocr_env", "latex_ocr_env.server"]
package-dir = { "latex_ocr_env" = ".", "latex_ocr_env.server" = "server" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
latex_ocr_env = ["openenv.yaml", "LICENSE", "NOTICE"]
