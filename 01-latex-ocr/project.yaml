name: latex-ocr
title: "LaTeX OCR"
tagline: "Train Qwen3-VL-2B to read math images into LaTeX, with a verifiable reward."
order: 1
status: stable   # environment, shared notebook/GRPO runner, HF Jobs, smoke tests

hub:
  org: HuggingEnvs
  spaces:
    - AdithyaSK/latex-ocr-env

envs:
  - name: latex_ocr
    summary: "Single-turn image -> LaTeX, reward from an OpenEnv server."
    backend: http
    frameworks:
      openenv: {transport: http-websocket, space: AdithyaSK/latex-ocr-env, verified: true}
