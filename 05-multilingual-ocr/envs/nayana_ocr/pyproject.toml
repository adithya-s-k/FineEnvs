[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-nayana-ocr"
version = "0.4.0"
description = "Replayable multilingual OCR and VQA tasks streamed from Nayana into OpenEnv"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "openenv==0.4.2",
  "datasets==5.0.1",
  "huggingface-hub==1.31.0",
  "pyarrow==25.0.1",
  "Pillow>=11,<13",
  "rapidfuzz>=3.14,<4",
  "requests>=2.32,<3",
  "gradio>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
train = [
  "trl[vlm]==1.13.0",
  "transformers>=5.2,<6",
  "peft>=0.18,<1",
  "trackio==0.37.1",
  "torch>=2.7,<3",
  "accelerate>=1.4,<2",
]

[project.scripts]
nayana-mirror = "nayana_ocr.data.mirror:main"
nayana-index = "nayana_ocr.data.index:main"
nayana-prepare = "nayana_ocr.data.prepare:main"
nayana-server = "nayana_ocr.server.app:main"
nayana-smoke = "nayana_ocr.smoke:main"

[tool.setuptools]
packages = ["nayana_ocr", "nayana_ocr.data", "nayana_ocr.server"]
package-dir = {nayana_ocr = "."}

[tool.setuptools.package-data]
nayana_ocr = ["openenv.yaml", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
