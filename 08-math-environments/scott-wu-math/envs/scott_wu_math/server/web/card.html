<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scott Wu Math · Environment card</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .doc { max-width: 820px; margin: 0 auto; padding: 24px 24px 64px; }
  .doc h1 { font-size: 26px; margin: 8px 0 12px; }
  .doc h2 { font-size: 19px; margin: 32px 0 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .doc h3 { font-size: 16px; margin: 22px 0 6px; }
  .doc p, .doc li { font-size: 15px; }
  .doc code { font-family: var(--mono); font-size: 13px; background: var(--btn-hover); padding: 1px 4px; border-radius: 4px; }
  .doc pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; }
  .doc pre code { background: none; padding: 0; }
  .doc table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
  .doc th, .doc td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .doc th { color: var(--muted); font-weight: 500; }
  .doc img { max-width: 100%; }
  @media (max-width: 560px) { .doc { padding: 16px 16px 48px; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><a href="/" style="text-decoration:none">Scott Wu Math</a></div>
  <nav><a href="/">Play</a><a href="/static/card.html" aria-current="page">Environment card</a><a href="/docs">API</a></nav>
</header>
<article class="doc" id="doc">Loading…</article>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  fetch("/readme.md").then((r) => r.text()).then((md) => {
    md = md.replace(/^---[\s\S]*?\n---\n/, "");  // drop the Space front matter
    document.getElementById("doc").innerHTML = marked.parse(md);
  });
</script>
</body>
</html>
