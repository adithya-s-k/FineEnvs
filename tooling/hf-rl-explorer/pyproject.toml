[project]
name = "rl-explorer"
version = "0.1.0"
description = "Explore RL environment datasets in Harbor's format: browse tasks, see how they are graded, run agents on HF Sandboxes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "huggingface_hub>=1.29",
    "pyyaml>=6",
    "cryptography>=44",
    "openenv",
    "harbor>=0.23",
    "pyarrow>=17",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pypdf>=5",
    "pillow>=10",
    "langdetect>=1.0.9",
]

[tool.uv]
package = false

[tool.uv.sources]
openenv = { git = "https://github.com/huggingface/OpenEnv", rev = "49aa302ba5c67041d11da128139ba3ae15529543" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
