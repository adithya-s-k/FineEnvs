[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-data-agent-env"
version = "0.1.0"
description = "Data-analysis agent tasks: an agent reads real tables in a sandbox and files an answer"
# 3.12, not 3.10: the capture stack and `openenv.core.sandbox` both require it.
requires-python = ">=3.12"
dependencies = [
    # Brings the capture proxy, the harness contract and the shared sandbox backends. This env
    # implements none of those; see sandbox/__init__.py for why it no longer vendors them.
    "openenv>=0.3.1",
    "datasets>=2.19",
    "huggingface_hub>=1.12",
    "fastapi>=0.115",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.24",
]

# Sandbox backends are OPTIONAL and independent: a deployment installs only the one it will use, and
# `openenv.core.sandbox` imports each lazily, so a missing SDK for one never breaks the other.
[project.optional-dependencies]
e2b = ["e2b>=1.0.0"]
# `huggingface_hub.Sandbox` ships in 1.22; there is no `[sandbox]` extra, and asking for one makes
# uv warn and then silently resolve without it.
hf = ["huggingface_hub>=1.22"]
dev = ["pytest>=9.0.3", "pytest-cov>=4.0.0"]

[project.scripts]
server = "data_agent_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["data_agent_env", "data_agent_env.server"]
package-dir = { "data_agent_env" = ".", "data_agent_env.server" = "server" }
