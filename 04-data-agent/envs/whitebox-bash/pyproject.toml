[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-whitebox-bash-env"
version = "0.1.0"
description = "White-box bash / Jupyter / file agent environment for TRL's synchronous GRPOTrainer."
requires-python = ">=3.10"
# The TRAINER only needs the client half: a class whose methods are the tools. Keep this list to
# what `client.py` imports, so `pip install` on a training node does not drag in the sandbox stack.
dependencies = [
    "openenv-core>=0.1",
]

[project.optional-dependencies]
# Everything the hosted server needs and the trainer does not.
server = [
    "fastmcp>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "e2b>=1.0",
    "datasets>=2.19",
]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["whitebox_bash", "whitebox_bash.server"]

[tool.setuptools.package-dir]
whitebox_bash = "."
"whitebox_bash.server" = "server"
