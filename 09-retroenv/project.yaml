# Project manifest. `tools/build_index.py` renders the root README table from it.
name: retroenv
title: "RetroEnv"
tagline: "Plan retrosyntheses back to purchasable molecules, scored against patent routes by a deterministic verifier."
order: 9
status: wip

hub:
  org: FineEnvs
  spaces: []
  datasets:
