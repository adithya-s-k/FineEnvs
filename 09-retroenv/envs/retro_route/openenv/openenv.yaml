spec_version: 1
name: retro_route
type: space
runtime: fastapi
app: retroenv_openenv.server:app
port: 8000

variables:
  RETROENV_CORPUS_MANIFEST: ""        # the serving snapshot (default: corpus-manifest.json here), or
  RETROENV_BENCHMARK_DIR: ""          # a local release or prepared directory, or
  RETROENV_TASKS_REPO: ""             # a release dataset (org/name or org/name@revision)
  RETROENV_BUCKET_ROOT: ""            # a mounted copy of the serving bucket (/data on the Space)
  RETROENV_DEFAULT_SPLIT: train       # splits: train, dev, test_id, test_hard, final_eval
  RETROENV_MAX_TOOL_CALLS: "32"
  RETROENV_TOOLSET: full              # full | unaided (no validate_disconnection)
  MAX_CONCURRENT_ENVS: "64"
