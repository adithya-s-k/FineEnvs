<div class="nm-hub" style="width:100%;margin:14px 0;"></div>
<style>
  .nm-hub { position: relative; }
  .nm-hub svg { display:block; width:100%; height:auto; overflow:visible; }
  .nm-hub .lg { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font-size:12px; color:var(--muted-color); }
  .nm-hub .lg-t { width:100%; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  .nm-hub .k { display:inline-flex; align-items:center; gap:7px; }
  .nm-hub .sw { width:13px; height:3px; border-radius:2px; }
  .nm-hub .nt { margin-top:10px; font-size:12px; line-height:1.5; color:var(--muted-color); }
</style>
<script>
  (() => {
    const C = 'nm-hub';
    const boot = () => {
      const n = [...document.querySelectorAll('.'+C)].filter(e => e.dataset.mounted !== 'true');
      const r = n[n.length-1]; if (!r) return; r.dataset.mounted = 'true';
      const V = (k,f) => (getComputedStyle(r).getPropertyValue(k).trim() || f);
      const P = (i) => {
        if (window.ColorPalettes && window.ColorPalettes.categorical) {
          try { return window.ColorPalettes.categorical(4)[i%4]; } catch(e) {}
        }
        return ['rgb(78,165,183)','rgb(146,176,234)','rgb(206,192,250)','rgb(232,137,171)'][i%4];
      };
      const draw = () => {
        const W = Math.max(320, r.clientWidth);
        const bd = V('--border-color','rgba(128,128,128,.3)');
        const mu = V('--muted-color','rgba(128,128,128,.8)');
        const tx = V('--text-color','#16181d');
        const sf = V('--surface-bg','#fff');
        const H = Math.max(250, Math.round(W/2.6));
        const N = 4, M = 4, pw = (W-34)/2, c0 = P(0), c3 = P(3);
        const col = (x, k, lab) => {
          let g = '';
          const top = 52, gap = (H-100)/(k-1);
          for (let i=0;i<k;i++) g += `<rect x="${x-19}" y="${top+i*gap-9}" width="38" height="18" rx="4" fill="${sf}" stroke="${bd}"/>`;
          g += `<text x="${x}" y="${H-22}" text-anchor="middle" font-size="11" fill="${mu}" font-family="ui-monospace,Menlo,monospace">${lab}</text>`;
          return g;
        };
        const ys = (k,i) => 52 + i*((H-100)/(k-1));
        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Every harness and sandbox pair wired directly, versus all of them sharing one capture layer">`;
        // left: full mesh
        const lx1 = 44, lx2 = pw-44;
        for (let i=0;i<N;i++) for (let j=0;j<M;j++)
          s += `<line x1="${lx1+19}" y1="${ys(N,i)}" x2="${lx2-19}" y2="${ys(M,j)}" stroke="${c3}" stroke-opacity=".5" stroke-width="1"/>`;
        s += col(lx1, N, 'harnesses') + col(lx2, M, 'sandboxes');
        s += `<text x="${pw/2}" y="30" text-anchor="middle" font-size="12.5" font-weight="600" fill="${tx}">${N*M} paths to maintain</text>`;
        // right: hub
        const ox = pw+34, rx1 = ox+44, rx2 = ox+pw-44, hx = ox+pw/2, hy = H/2+6;
        for (let i=0;i<N;i++) s += `<line x1="${rx1+19}" y1="${ys(N,i)}" x2="${hx-30}" y2="${hy}" stroke="${c0}" stroke-opacity=".65" stroke-width="1"/>`;
        for (let j=0;j<M;j++) s += `<line x1="${hx+30}" y1="${hy}" x2="${rx2-19}" y2="${ys(M,j)}" stroke="${c0}" stroke-opacity=".65" stroke-width="1"/>`;
        s += col(rx1, N, 'harnesses') + col(rx2, M, 'sandboxes');
        s += `<rect x="${hx-30}" y="${hy-15}" width="60" height="30" rx="7" fill="${sf}" stroke="${c0}" stroke-width="1.5"/>`;
        s += `<text x="${hx}" y="${hy+4}" text-anchor="middle" font-size="11" fill="${tx}" font-family="ui-monospace,Menlo,monospace">capture</text>`;
        s += `<text x="${ox+pw/2}" y="30" text-anchor="middle" font-size="12.5" font-weight="600" fill="${tx}">${N+M} paths, one layer</text>`;
        s += '</svg>';
        r.innerHTML = s + `<div class="nt">The line count is the argument. Wiring each harness to each sandbox means maintaining the product; putting one capture layer between them means maintaining the sum, and adding the next harness becomes a table entry rather than a package.</div>`;
      };
      draw();
      if ('ResizeObserver' in window) { let t; new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(draw,120);}).observe(r); }
      else window.addEventListener('resize', draw);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
</script>
