<div class="harness-lockin" style="width:100%;margin:14px 0;"></div>
<style>
  .harness-lockin { position: relative; }
  .harness-lockin svg { display:block; width:100%; height:auto; overflow:visible; }
  .harness-lockin .lg { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font-size:12px; color:var(--muted-color); }
  .harness-lockin .lg-t { width:100%; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  .harness-lockin .k { display:inline-flex; align-items:center; gap:7px; }
  .harness-lockin .sw { width:13px; height:10px; border-radius:2px; }
  .harness-lockin .nt { margin-top:10px; font-size:12px; line-height:1.55; color:var(--muted-color); }
</style>
<script>
  (() => {
    const C = 'harness-lockin';
    const boot = () => {
      const n = [...document.querySelectorAll('.'+C)].filter(e => e.dataset.mounted !== 'true');
      const r = n[n.length-1]; if (!r) return; r.dataset.mounted = 'true';
      const V = (k,f) => (getComputedStyle(r).getPropertyValue(k).trim() || f);
      const P = (i) => {
        if (window.ColorPalettes && window.ColorPalettes.categorical) {
          try { return window.ColorPalettes.categorical(4)[i%4]; } catch(e) {}
        }
        return ['rgb(78,165,183)','rgb(146,176,234)','rgb(206,192,250)','rgb(232,137,171)'][i%4];
      };

      // Orchard, Table 9 and section 3.7. Resolve rate (%), matched conditions.
      // star = number reported in the original system's own paper.
      // null = the system produced malformed tool calls, so there is no rate at all.
      const COLS = [
        {harness:'OpenHands',      task:'SWE-V',        seen:true},
        {harness:'mini-swe-agent', task:'SWE-V',        seen:true},
        {harness:'mini-swe-agent', task:'SWE-M',        seen:true},
        {harness:'Kimi-CLI',       task:'SWE-V',        seen:false},
        {harness:'Kimi-CLI',       task:'T-Bench 2.0',  seen:false},
      ];
      const ROWS = [
        {n:'Scale-SWE',    sub:'trained in one harness',    v:[64.0, null, null, null, null], star:[1,0,0,0,0], c:3},
        {n:'OpenSWE-32B',  sub:'trained in one harness',    v:[62.4, 54.9, 28.7, 3.6,  0.0 ], star:[1,0,0,0,0], c:3},
        {n:'Orchard-SWE',  sub:'trained across harnesses',  v:[62.1, 64.3, 51.0, 45.0, 20.1], star:[0,0,0,0,0], c:0},
      ];

      const draw = () => {
        const W = Math.max(320, r.clientWidth);
        const bd = V('--border-color','rgba(128,128,128,.3)');
        const mu = V('--muted-color','rgba(128,128,128,.8)');
        const tx = V('--text-color','#16181d');
        const narrow = W < 620;

        const labW = narrow ? 118 : 168;
        const padR = 6;
        const headH = narrow ? 54 : 58;
        const rowH  = narrow ? 58 : 62;
        const H = headH + ROWS.length*rowH + 26;
        const gridW = W - labW - padR;
        const cw = gridW / COLS.length;
        const barMax = 70;                       // common scale for every cell
        const barW = cw - (narrow ? 14 : 22);
        const fs = narrow ? 10 : 11.5;

        const cx = i => labW + i*cw + (cw - barW)/2;
        const split = labW + 3*cw;               // where the unseen harness starts

        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Three systems evaluated across three harnesses and two task sets. The single-harness systems lose a little on a harness they have seen and collapse on one they have not.">`;

        // the unseen-harness field, called out rather than left to the reader
        s += `<rect x="${split}" y="${headH-34}" width="${W-split-padR+2}" height="${ROWS.length*rowH+30}" fill="${P(3)}" fill-opacity=".05"/>`;
        s += `<line x1="${split}" y1="${headH-34}" x2="${split}" y2="${headH+ROWS.length*rowH-4}" stroke="${bd}"/>`;

        // column headers: harness on top, task underneath
        let i = 0;
        while (i < COLS.length) {
          let j = i; while (j+1 < COLS.length && COLS[j+1].harness === COLS[i].harness) j++;
          const midX = labW + ((i + j + 1)/2)*cw;
          const unseen = !COLS[i].seen;
          s += `<text x="${midX}" y="${headH-38}" text-anchor="middle" font-size="${fs+.5}" font-weight="600" fill="${unseen ? P(3) : tx}" font-family="ui-monospace,Menlo,monospace">${COLS[i].harness}</text>`;
          if (unseen) s += `<text x="${midX}" y="${headH-24}" text-anchor="middle" font-size="${fs-1}" fill="${P(3)}">never seen in training</text>`;
          i = j + 1;
        }
        COLS.forEach((c,k) => {
          s += `<text x="${labW + k*cw + cw/2}" y="${headH-6}" text-anchor="middle" font-size="${fs-.5}" fill="${mu}" font-family="ui-monospace,Menlo,monospace">${c.task}</text>`;
        });

        ROWS.forEach((row,ri) => {
          const yTop = headH + ri*rowH;
          const yBar = yTop + (narrow ? 26 : 28);
          const col = P(row.c);
          s += `<line x1="0" y1="${yTop-4}" x2="${W-padR}" y2="${yTop-4}" stroke="${bd}" stroke-opacity=".7"/>`;
          s += `<text x="0" y="${yTop+16}" font-size="${fs+1.5}" font-weight="600" fill="${tx}">${row.n}</text>`;
          s += `<text x="0" y="${yTop+32}" font-size="${fs-.5}" fill="${mu}">${row.sub}</text>`;

          row.v.forEach((v,k) => {
            const x0 = cx(k);
            if (v === null) {
              // no bar, because there is no score: malformed tool calls. The
              // reason is written once per row rather than in every cell.
              const mx = x0 + barW/2, my = yBar - 3;
              s += `<path d="M${mx-6} ${my-6} L${mx+6} ${my+6} M${mx+6} ${my-6} L${mx-6} ${my+6}" stroke="${P(3)}" stroke-width="2" stroke-linecap="round"/>`;
              if (k === row.v.findIndex(q => q === null)) {
                s += `<text x="${x0}" y="${my+24}" font-size="${fs-1}" fill="${P(3)}">no valid tool calls anywhere but at home</text>`;
              }
              return;
            }
            const bh = narrow ? 13 : 15;
            s += `<rect x="${x0}" y="${yBar-bh}" width="${barW}" height="${bh}" rx="3" fill="${bd}" fill-opacity=".35"/>`;
            // a zero is drawn as an empty track, never as a sliver that reads as "some"
            if (v > 0) s += `<rect x="${x0}" y="${yBar-bh}" width="${Math.max(2, barW*(v/barMax))}" height="${bh}" rx="3" fill="${col}"/>`;
            s += `<text x="${x0}" y="${yBar+15}" font-size="${fs+.5}" font-weight="600" fill="${col}" font-family="ui-monospace,Menlo,monospace">${v.toFixed(1)}${row.star[k] ? '*' : ''}</text>`;
          });
        });

        // the two numbers the whole figure exists to compare
        const yOp = headH + 1*rowH + (narrow ? 26 : 28);
        s += `<text x="${W-padR}" y="${H-6}" text-anchor="end" font-size="${fs-.5}" fill="${mu}">* reported by that system's own paper; every other cell is Orchard's own matched run</text>`;
        s += '</svg>';

        r.innerHTML = s +
          `<div class="lg"><div class="lg-t">Legend</div>` +
          `<span class="k"><span class="sw" style="background:${P(3)}"></span>trained inside a single harness</span>` +
          `<span class="k"><span class="sw" style="background:${P(0)}"></span>trained across several harnesses</span>` +
          `<span class="k">bars share one 0–70% scale</span>` +
          `</div><div class="nt">Moving OpenSWE-32B off OpenHands, the harness it was trained in, onto mini-swe-agent costs 7.5 points. Moving it onto Kimi-CLI, which it had never seen, costs 58.8 and leaves 3.6. Scale-SWE does not degrade at all; away from its own harness it stops emitting valid tool calls, so there is no score to report. Orchard, trained across harnesses, stays inside a 19-point band and keeps 20.1 on a benchmark in a harness it never trained against.</div>`;
      };
      draw();
      if ('ResizeObserver' in window) { let t; new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(draw,120);}).observe(r); }
      else window.addEventListener('resize', draw);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
</script>
