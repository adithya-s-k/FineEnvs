<div class="sync-baseline" style="width:100%;margin:14px 0;"></div>
<style>
  .sync-baseline { position: relative; }
  .sync-baseline svg { display:block; width:100%; height:auto; overflow:visible; }
  .sync-baseline .lg { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font-size:12px; color:var(--muted-color); }
  .sync-baseline .lg-t { width:100%; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  .sync-baseline .k { display:inline-flex; align-items:center; gap:7px; }
  .sync-baseline .sw { width:13px; height:3px; border-radius:2px; }
  .sync-baseline .nt { margin-top:10px; font-size:12px; line-height:1.5; color:var(--muted-color); max-width:62ch; }
</style>
<script>
  (() => {
    const C = 'sync-baseline';
    const boot = () => {
      const n = [...document.querySelectorAll('.'+C)].filter(e => e.dataset.mounted !== 'true');
      const r = n[n.length-1]; if (!r) return; r.dataset.mounted = 'true';
      const V = (k,f) => (getComputedStyle(r).getPropertyValue(k).trim() || f);
      const P = (i) => {
        if (window.ColorPalettes && window.ColorPalettes.categorical) {
          try { return window.ColorPalettes.categorical(4)[i%4]; } catch(e) {}
        }
        return ['rgb(78,165,183)','rgb(146,176,234)','rgb(206,192,250)','rgb(232,137,171)'][i%4];
      };
      const draw = () => {
        const W = Math.max(320, r.clientWidth);
        const bd = V('--border-color','rgba(128,128,128,.3)');
        const mu = V('--muted-color','rgba(128,128,128,.8)');
        const tx = V('--text-color','#16181d');
        const sf = V('--surface-bg','#fff');
        const H = Math.max(200, Math.round(W/3.2));
        const c0 = P(0);
        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Placeholder for the synchronous baseline training curve">`;
        s += `<rect x="1" y="1" width="${W-2}" height="${H-2}" rx="10" fill="none" stroke="${bd}" stroke-dasharray="5 5"/>`;
        s += `<text x="${W/2}" y="${H/2-8}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${mu}">Awaiting the synchronous run</text>`;
        s += `<text x="${W/2}" y="${H/2+13}" text-anchor="middle" font-size="11.5" fill="${mu}">reward against step, with held-out eval overlaid and the kept checkpoint marked</text>`;
        s += '</svg>';
        r.innerHTML = s + `<div class="nt">Placeholder. Drop the run's metrics into assets/data/ and this becomes a real chart; the axis should start at zero so the improvement is not visually inflated.</div>`;
      };
      draw();
      if ('ResizeObserver' in window) { let t; new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(draw,120);}).observe(r); }
      else window.addEventListener('resize', draw);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
</script>
