<div class="harbor-matrix" style="width:100%;margin:14px 0;"></div>
<style>
  .harbor-matrix { position: relative; }
  .harbor-matrix svg { display:block; width:100%; height:auto; overflow:visible; }
  .harbor-matrix .lg { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font-size:12px; color:var(--muted-color); }
  .harbor-matrix .lg-t { width:100%; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  .harbor-matrix .k { display:inline-flex; align-items:center; gap:7px; }
  .harbor-matrix .sw { width:13px; height:3px; border-radius:2px; }
  .harbor-matrix .nt { margin-top:10px; font-size:12px; line-height:1.5; color:var(--muted-color); }
</style>
<script>
  (() => {
    const C = 'harbor-matrix';
    const boot = () => {
      const n = [...document.querySelectorAll('.'+C)].filter(e => e.dataset.mounted !== 'true');
      const r = n[n.length-1]; if (!r) return; r.dataset.mounted = 'true';
      const V = (k,f) => (getComputedStyle(r).getPropertyValue(k).trim() || f);
      const P = (i) => {
        if (window.ColorPalettes && window.ColorPalettes.categorical) {
          try { return window.ColorPalettes.categorical(4)[i%4]; } catch(e) {}
        }
        return ['rgb(78,165,183)','rgb(146,176,234)','rgb(206,192,250)','rgb(232,137,171)'][i%4];
      };
      const draw = () => {
        const W = Math.max(320, r.clientWidth);
        const bd = V('--border-color','rgba(128,128,128,.3)');
        const mu = V('--muted-color','rgba(128,128,128,.8)');
        const tx = V('--text-color','#16181d');
        const sf = V('--surface-bg','#fff');
        const H = Math.max(190, Math.round(W/3.4));
        // Counts read from Harbor v0.22.0: 80 registry datasets, 44 agent names,
        // 28 environment types. The integration pins harbor>=0.20, which had fewer.
        const A = [
          {n:'80', l:'task datasets', e:'Terminal-Bench, SWE-bench, DABstep, and your own'},
          {n:'44', l:'agent harnesses', e:'claude-code, codex, opencode, goose, swe-agent, and more'},
          {n:'28', l:'execution backends', e:'docker, daytona, modal, e2b, runloop, hf-sandbox'},
        ];
        const cw = W/A.length;
        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Harbor covers benchmarks, agent harnesses and execution backends, each varying independently">`;
        A.forEach((a,i) => {
          const cx = cw*i + cw/2, c = P(i);
          s += `<text x="${cx}" y="${H*0.42}" text-anchor="middle" font-size="${Math.min(46, W/13)}" font-weight="800" fill="${c}">${a.n}</text>`;
          s += `<text x="${cx}" y="${H*0.42+24}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${tx}">${a.l}</text>`;
          const words = a.e.split(', ');
          const lines = []; let cur = '';
          words.forEach(w => { if ((cur+w).length > 30) { lines.push(cur); cur = w; } else cur += (cur?', ':'')+w; });
          if (cur) lines.push(cur);
          lines.forEach((ln,j) => s += `<text x="${cx}" y="${H*0.42+44+j*15}" text-anchor="middle" font-size="11" fill="${mu}">${ln}</text>`);
          if (i < A.length-1) s += `<text x="${cw*(i+1)}" y="${H*0.42-6}" text-anchor="middle" font-size="20" fill="${mu}" opacity=".5">×</text>`;
        });
        s += '</svg>';
        r.innerHTML = s + `<div class="nt">A task is written once and any harness can attempt it on any backend. Counts are from Harbor v0.22.0 and keep growing, which is the point: the size of that product is why this integration consumes Harbor rather than reimplementing it, and why adding the next harness is a table entry rather than a package.</div>`;
      };
      draw();
      if ('ResizeObserver' in window) { let t; new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(draw,120);}).observe(r); }
      else window.addEventListener('resize', draw);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
</script>
