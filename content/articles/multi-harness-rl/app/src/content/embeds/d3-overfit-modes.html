<div class="overfit-modes" style="width:100%;margin:14px 0;"></div>
<style>
  .overfit-modes { position: relative; }
  .overfit-modes svg { display:block; width:100%; height:auto; overflow:visible; }
  .overfit-modes .nt { margin-top:10px; font-size:12px; line-height:1.55; color:var(--muted-color); }
</style>
<script>
  (() => {
    const C = 'overfit-modes';
    const boot = () => {
      const n = [...document.querySelectorAll('.'+C)].filter(e => e.dataset.mounted !== 'true');
      const r = n[n.length-1]; if (!r) return; r.dataset.mounted = 'true';
      const V = (k,f) => (getComputedStyle(r).getPropertyValue(k).trim() || f);
      const P = (i) => {
        if (window.ColorPalettes && window.ColorPalettes.categorical) {
          try { return window.ColorPalettes.categorical(4)[i%4]; } catch(e) {}
        }
        return ['rgb(78,165,183)','rgb(146,176,234)','rgb(206,192,250)','rgb(232,137,171)'][i%4];
      };
      const esc = (t) => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

      // The three modes are KAT-Coder's. The examples are the concrete form each
      // one takes on the wire, so the row is readable without the chapter text.
      const MODES = [
        {
          name:'Format',
          gloss:'anchored to one action format',
          trained:{ h:'trained in a tool-calling harness', code:'"tool_calls": [{"name": "edit_file", …}]' },
          foreign:{ h:'dropped into aider, which takes edits in prose', code:'<<<<<<< SEARCH … ======= … >>>>>>> REPLACE' },
          seen:'The JSON arrives as chat text. Nothing is parsed, nothing is edited, and the turn is scored as a non-answer.'
        },
        {
          name:'Context structure',
          gloss:'anchored to one way of stacking history',
          trained:{ h:'trained where each result is its own message', code:'role: "tool"  →  one message per result' },
          foreign:{ h:'dropped into a harness that compacts history', code:'role: "user"  →  one summarised turn' },
          seen:'Its own earlier results are no longer where it expects them, so it repeats work it has already done.'
        },
        {
          name:'Control flow',
          gloss:'anchored to someone else’s retry and stop rules',
          trained:{ h:'trained where the harness retries for it', code:'exit 1  →  harness retries, then stops at step N' },
          foreign:{ h:'dropped into a harness that just reports and waits', code:'exit 1  →  error returned to the model' },
          seen:'It runs the same failing command again, because deciding when to stop was never its job.'
        },
      ];

      const draw = () => {
        const W = Math.max(320, r.clientWidth);
        const bd = V('--border-color','rgba(128,128,128,.3)');
        const mu = V('--muted-color','rgba(128,128,128,.8)');
        const tx = V('--text-color','#16181d');
        const narrow = W < 680;

        const pad = 14;
        const labW = narrow ? 0 : 168;                 // stacked on narrow screens
        const colGap = 14;
        const bodyX = labW ? labW + colGap : pad;
        const bodyW = W - bodyX - pad;
        const colW = (bodyW - colGap) / 2;
        const fsMono = narrow ? 9.5 : 10.5;
        const fs = narrow ? 11 : 12;

        // monospace wraps on a character budget; prose wraps on a wider one
        const wrapChars = (t, px, perChar) => {
          const limit = Math.max(8, Math.floor(px / perChar));
          const out = []; let cur = '';
          t.split(' ').forEach(w => {
            if ((cur + ' ' + w).trim().length > limit) { out.push(cur); cur = w; }
            else cur = (cur + ' ' + w).trim();
          });
          if (cur) out.push(cur);
          return out;
        };

        const rows = MODES.map(m => {
          const tl = wrapChars(m.trained.code, colW - 20, fsMono * 0.60);
          const fl = wrapChars(m.foreign.code, colW - 20, fsMono * 0.60);
          const th = wrapChars(m.trained.h, colW, fs * 0.52);
          const fh = wrapChars(m.foreign.h, colW, fs * 0.52);
          const sn = wrapChars(m.seen, bodyW, fs * 0.52);
          const codeLines = Math.max(tl.length, fl.length);
          const headLines = Math.max(th.length, fh.length);
          const labLines = narrow ? 2 : 0;
          const h = 10 + labLines*18 + headLines*15 + 8 + codeLines*15 + 26 + sn.length*16 + 14;
          return {m, tl, fl, th, fh, sn, codeLines, headLines, h};
        });

        const H = rows.reduce((a,b) => a + b.h + 12, 6);
        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Three ways a model overfits to its harness, each with the concrete form it takes: a format it keeps emitting, a history layout it expects, and retry rules it leans on.">`;

        let y = 6;
        rows.forEach((row, i) => {
          const c = P(i);
          const m = row.m;
          s += `<rect x="0" y="${y}" width="${W}" height="${row.h}" rx="10" fill="${c}" fill-opacity=".05"/>`;
          s += `<rect x="0" y="${y}" width="3" height="${row.h}" rx="1.5" fill="${c}"/>`;

          let ty = y + 22;
          if (narrow) {
            s += `<text x="${pad}" y="${ty}" font-size="${fs+1}" font-weight="700" fill="${tx}">${m.name} overfitting</text>`;
            s += `<text x="${pad}" y="${ty+16}" font-size="${fs-1}" fill="${mu}">${m.gloss}</text>`;
            ty += 36;
          } else {
            s += `<text x="${pad}" y="${y+24}" font-size="${fs+1}" font-weight="700" fill="${tx}">${m.name}</text>`;
            s += `<text x="${pad}" y="${y+40}" font-size="${fs-1}" fill="${mu}">overfitting</text>`;
            const gl = wrapChars(m.gloss, labW - pad, (fs-1) * 0.52);
            gl.forEach((ln,j) => s += `<text x="${pad}" y="${y+62+j*14}" font-size="${fs-1.5}" fill="${mu}">${ln}</text>`);
          }

          // two columns: what it was trained against, what it was dropped into
          [[0, m.trained, row.th, row.tl, c], [1, m.foreign, row.fh, row.fl, P(3)]].forEach(([k, side, heads, code, col]) => {
            const x = bodyX + k*(colW + colGap);
            heads.forEach((ln,j) => s += `<text x="${x}" y="${ty + j*15}" font-size="${fs}" font-weight="${j===0?600:400}" fill="${k ? P(3) : tx}">${ln}</text>`);
            const cy = ty + row.headLines*15 + 6;
            s += `<rect x="${x}" y="${cy}" width="${colW}" height="${row.codeLines*15 + 12}" rx="6" fill="${V('--surface-bg','#fff')}" stroke="${bd}"/>`;
            code.forEach((ln,j) => s += `<text x="${x+10}" y="${cy + 17 + j*15}" font-size="${fsMono}" fill="${col}" font-family="ui-monospace,Menlo,monospace">${esc(ln)}</text>`);
          });

          // the symptom, spanning both columns
          const sy = ty + row.headLines*15 + 6 + row.codeLines*15 + 12 + 36;
          row.sn.forEach((ln,j) => s += `<text x="${bodyX}" y="${sy + j*16}" font-size="${fs}" fill="${mu}">${j===0 ? '' : ''}${ln}</text>`);
          s += `<text x="${bodyX}" y="${sy-16}" font-size="${fs-2}" fill="${mu}" font-family="ui-monospace,Menlo,monospace" letter-spacing="1">WHAT YOU SEE</text>`;

          y += row.h + 12;
        });
        s += '</svg>';

        r.innerHTML = s + `<div class="nt">The three modes are the KAT-Coder team's; the examples are the form each one takes on the wire. All three have the same cure and it is not three separate patches: vary the harness during rollouts, and none of the three has a fixed target to anchor to.</div>`;
      };
      draw();
      if ('ResizeObserver' in window) { let t; new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(draw,120);}).observe(r); }
      else window.addEventListener('resize', draw);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
</script>
