<div class="harbor-task" style="width:100%;margin:14px 0;"></div>
<style>
  .harbor-task { position: relative; }
  .harbor-task svg { display:block; width:100%; height:auto; overflow:visible; }
  .harbor-task .lg { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font-size:12px; color:var(--muted-color); }
  .harbor-task .lg-t { width:100%; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  .harbor-task .k { display:inline-flex; align-items:center; gap:7px; }
  .harbor-task .sw { width:13px; height:3px; border-radius:2px; }
  .harbor-task .rp { margin-top: 16px; }
  .harbor-task .rp-t { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-color); opacity:.8; margin-bottom:7px; }
  .harbor-task .rp ol { margin:0; padding-left:20px; font-size:12.5px; line-height:1.55; color:var(--text-color); }
  .harbor-task .rp li { margin:0; padding:1px 0; }
  .harbor-task .dif { margin-top:18px; }
  .harbor-task .bars { display:flex; gap:4px; align-items:stretch; }
  .harbor-task .b { position:relative; min-width:0; }
  .harbor-task .fill { height:10px; border-radius:3px; }
  .harbor-task .fill { height:12px; border-radius:3px; }
  .harbor-task .dkeys { display:flex; flex-wrap:wrap; gap:5px 18px; margin-top:10px; font-size:11.5px; color:var(--muted-color); }
  .harbor-task .dk { display:inline-flex; align-items:center; gap:7px; }
  .harbor-task .dk b { color:var(--text-color); }
  .harbor-task .dsw { width:12px; height:8px; border-radius:2px; flex:none; }
  .harbor-task .nt { margin-top:10px; font-size:12px; line-height:1.5; color:var(--muted-color); max-width:62ch; }
</style>
<script>
  (() => {
    const C = 'harbor-task';
    const boot = () => {
      const n = [...document.querySelectorAll('.'+C)].filter(e => e.dataset.mounted !== 'true');
      const r = n[n.length-1]; if (!r) return; r.dataset.mounted = 'true';
      const V = (k,f) => (getComputedStyle(r).getPropertyValue(k).trim() || f);
      const P = (i) => {
        if (window.ColorPalettes && window.ColorPalettes.categorical) {
          try { return window.ColorPalettes.categorical(4)[i%4]; } catch(e) {}
        }
        return ['rgb(78,165,183)','rgb(146,176,234)','rgb(206,192,250)','rgb(232,137,171)'][i%4];
      };
      const grab = async (f) => {
        for (const u of ['/data/'+f, 'assets/data/'+f]) {
          try { const x = await fetch(u, {cache:'no-cache'}); if (x.ok) return await x.json(); } catch(e) {}
        }
        throw new Error('could not load '+f);
      };
      let D = null;
      const draw = () => {
        if (!D) return;
        const W = Math.max(320, r.clientWidth);
        const bd = V('--border-color','rgba(128,128,128,.3)');
        const mu = V('--muted-color','rgba(128,128,128,.8)');
        const tx = V('--text-color','#16181d');
        const sf = V('--surface-bg','#fff');
        const F = D.files, R = D.reward_path;
        const rowH = 44, H = 34 + F.length*rowH + 6;
        const c0 = P(0), c3 = P(3);
        const cx = Math.min(300, W*0.38);
        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="The files that make up one Harbor task and what each one does">`;
        s += `<text x="0" y="16" font-size="11" fill="${mu}" font-family="ui-monospace,Menlo,monospace">${D.example}/</text>`;
        F.forEach((f,i) => {
          const y = 34 + i*rowH;
          const last = i === F.length-1;
          s += `<line x1="9" y1="${y-24}" x2="9" y2="${last ? y-4 : y+rowH-24}" stroke="${bd}"/>`;
          s += `<line x1="9" y1="${y-4}" x2="22" y2="${y-4}" stroke="${bd}"/>`;
          s += `<text x="28" y="${y}" font-size="12.5" fill="${tx}" font-family="ui-monospace,Menlo,monospace">${f.path}</text>`;
          s += `<text x="${cx}" y="${y}" font-size="12" font-weight="600" fill="${c0}">${f.role}</text>`;
          s += `<text x="${cx}" y="${y+16}" font-size="11.5" fill="${mu}">${f.detail}</text>`;
        });
        s += '</svg>';
        let rp = '<div class="rp"><div class="rp-t">How the reward gets out</div><ol>' +
          R.map(x => `<li>${x}</li>`).join('') + '</ol></div>';
        const dif = D.suite.difficulty, tot = D.suite.tasks;
        let bar = '<div class="dif"><div class="rp-t">' + tot.toLocaleString() + ' tasks by difficulty</div><div class="bars">';
        dif.forEach((d,i) => {
          bar += `<div class="b" style="flex:${Math.max(d.count,30)}" title="${d.level}: ${d.what}">
            <div class="fill" style="background:${P(i)};opacity:${0.4+0.13*i}"></div></div>`;
        });
        bar += '</div><div class="dkeys">' + dif.map((d,i) =>
          `<span class="dk"><span class="dsw" style="background:${P(i)};opacity:${0.4+0.13*i}"></span><b>${d.level}</b> ${d.count} &middot; ${d.what}</span>`
        ).join('') + '</div></div>';
        r.innerHTML = s + rp + bar +
          `<div class="nt">One task from <a href="${D.url}" target="_blank" rel="noopener noreferrer">${D.source}</a>, unedited. Every task in the suite has this shape, which is what makes it servable: nothing about it names a harness, a sandbox or a trainer.</div>`;
      };
      grab('harbor-task.json').then(d => { D = d; draw(); }).catch(e => { r.innerHTML = '<div class="nt">'+e.message+'</div>'; });
      if ('ResizeObserver' in window) { let t; new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(draw,120);}).observe(r); }
      else window.addEventListener('resize', draw);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
</script>
