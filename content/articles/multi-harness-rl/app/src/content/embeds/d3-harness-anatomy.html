<div class="harness-anatomy" style="width:100%;margin:14px 0;"></div>
<style>
  .harness-anatomy { position: relative; }
  .harness-anatomy svg { display:block; width:100%; height:auto; overflow:visible; }
  .harness-anatomy .lg { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font-size:12px; color:var(--muted-color); }
  .harness-anatomy .lg-t { width:100%; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  .harness-anatomy .k { display:inline-flex; align-items:center; gap:7px; }
  .harness-anatomy .sw { width:13px; height:3px; border-radius:2px; }
  .harness-anatomy .nt { margin-top:10px; font-size:12px; line-height:1.5; color:var(--muted-color); max-width:62ch; }
</style>
<script>
  (() => {
    const C = 'harness-anatomy';
    const boot = () => {
      const n = [...document.querySelectorAll('.'+C)].filter(e => e.dataset.mounted !== 'true');
      const r = n[n.length-1]; if (!r) return; r.dataset.mounted = 'true';
      const V = (k,f) => (getComputedStyle(r).getPropertyValue(k).trim() || f);
      const P = (i) => {
        if (window.ColorPalettes && window.ColorPalettes.categorical) {
          try { return window.ColorPalettes.categorical(4)[i%4]; } catch(e) {}
        }
        return ['rgb(78,165,183)','rgb(146,176,234)','rgb(206,192,250)','rgb(232,137,171)'][i%4];
      };
      const draw = () => {
        const W = Math.max(320, r.clientWidth);
        const bd = V('--border-color','rgba(128,128,128,.3)');
        const mu = V('--muted-color','rgba(128,128,128,.8)');
        const tx = V('--text-color','#16181d');
        const sf = V('--surface-bg','#fff');
        const H = Math.max(250, Math.round(W/2.5));
        const bx = 24, by = 26, bw = W*0.60, bh = H-70;
        const c = P(0);
        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="A harness with its loop, tools and sandbox inside, and one model endpoint leaving it">`;
        s += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="12" fill="${sf}" stroke="${bd}"/>`;
        s += `<text x="${bx+16}" y="${by+22}" font-size="11.5" fill="${mu}" font-family="ui-monospace,Menlo,monospace">AGENT HARNESS</text>`;
        const parts = [
          ['the loop','decides what happens next, and when to stop'],
          ['the tool surface','which tools exist, and their schemas'],
          ['the context','what the model is shown each turn, and what is compacted away'],
          ['the sandbox','where the tool calls actually run'],
        ];
        const py = by+46, ph = (bh-64)/parts.length;
        parts.forEach((p,i) => {
          const y = py + i*ph;
          s += `<rect x="${bx+16}" y="${y}" width="${bw-32}" height="${ph-9}" rx="7" fill="none" stroke="${bd}" stroke-dasharray="3 3"/>`;
          s += `<text x="${bx+28}" y="${y+21}" font-size="13" font-weight="600" fill="${tx}">${p[0]}</text>`;
          s += `<text x="${bx+28}" y="${y+38}" font-size="12" fill="${mu}">${p[1]}</text>`;
        });
        const wy = by+bh/2, ex = W-30;
        s += `<line x1="${bx+bw}" y1="${wy}" x2="${ex-96}" y2="${wy}" stroke="${c}" stroke-width="2"/>`;
        s += `<circle cx="${bx+bw}" cy="${wy}" r="4" fill="${c}"/>`;
        s += `<rect x="${ex-92}" y="${wy-26}" width="88" height="52" rx="8" fill="${sf}" stroke="${c}" stroke-width="1.5"/>`;
        s += `<text x="${ex-48}" y="${wy-4}" text-anchor="middle" font-size="12" font-weight="600" fill="${tx}">model</text>`;
        s += `<text x="${ex-48}" y="${wy+13}" text-anchor="middle" font-size="11" fill="${mu}">endpoint</text>`;
        s += `<text x="${(bx+bw+ex-96)/2}" y="${wy-12}" text-anchor="middle" font-size="11.5" fill="${c}" font-family="ui-monospace,Menlo,monospace">one wire</text>`;
        s += '</svg>';
        r.innerHTML = s + `<div class="nt">Everything inside the box is the harness's business and none of it is visible to a trainer. The single wire on the right is the only surface anything outside can stand on, which is what the capture layer exploits.</div>`;
      };
      draw();
      if ('ResizeObserver' in window) { let t; new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(draw,120);}).observe(r); }
      else window.addEventListener('resize', draw);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
</script>
