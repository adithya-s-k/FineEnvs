<div class="dialects-funnel" style="width:100%;margin:14px 0;"></div>
<style>
  .dialects-funnel { position: relative; }
  .dialects-funnel svg { display:block; width:100%; height:auto; overflow:visible; }
  .dialects-funnel .lg { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font-size:12px; color:var(--muted-color); }
  .dialects-funnel .lg-t { width:100%; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  .dialects-funnel .k { display:inline-flex; align-items:center; gap:7px; }
  .dialects-funnel .sw { width:13px; height:3px; border-radius:2px; }
  .dialects-funnel .nt { margin-top:10px; font-size:12px; line-height:1.5; color:var(--muted-color); max-width:62ch; }
</style>
<script>
  (() => {
    const C = 'dialects-funnel';
    const boot = () => {
      const n = [...document.querySelectorAll('.'+C)].filter(e => e.dataset.mounted !== 'true');
      const r = n[n.length-1]; if (!r) return; r.dataset.mounted = 'true';
      const V = (k,f) => (getComputedStyle(r).getPropertyValue(k).trim() || f);
      const P = (i) => {
        if (window.ColorPalettes && window.ColorPalettes.categorical) {
          try { return window.ColorPalettes.categorical(4)[i%4]; } catch(e) {}
        }
        return ['rgb(78,165,183)','rgb(146,176,234)','rgb(206,192,250)','rgb(232,137,171)'][i%4];
      };
      const draw = () => {
        const W = Math.max(320, r.clientWidth);
        const bd = V('--border-color','rgba(128,128,128,.3)');
        const mu = V('--muted-color','rgba(128,128,128,.8)');
        const tx = V('--text-color','#16181d');
        const sf = V('--surface-bg','#fff');
        const H = Math.max(240, Math.round(W/2.9));
        const D = [['chat-completions','12 harnesses'],['OpenAI Responses','codex, trae-agent'],['Anthropic Messages','claude-code'],['Google generateContent','gemini-cli']];
        const lx = Math.min(210, W*0.26), hx = W*0.55, rx = W-30;
        const top = 42, gap = (H-96)/(D.length-1);
        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Four wire dialects normalised into one shape then replayed back out">`;
        s += `<defs><marker id="df" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="${mu}"/></marker></defs>`;
        D.forEach((d,i) => {
          const y = top + i*gap, c = P(i);
          s += `<text x="${lx-14}" y="${y+3}" text-anchor="end" font-size="12" font-weight="600" fill="${tx}">${d[0]}</text>`;
          s += `<text x="${lx-14}" y="${y+18}" text-anchor="end" font-size="11" fill="${mu}">${d[1]}</text>`;
          s += `<path d="M ${lx} ${y} C ${(lx+hx)/2} ${y}, ${(lx+hx)/2} ${H/2}, ${hx-34} ${H/2}" fill="none" stroke="${c}" stroke-width="1.8" stroke-opacity=".85"/>`;
          s += `<circle cx="${lx}" cy="${y}" r="3.4" fill="${c}"/>`;
          s += `<path d="M ${hx+34} ${H/2} C ${(hx+rx)/2} ${H/2}, ${(hx+rx)/2} ${y}, ${rx-8} ${y}" fill="none" stroke="${c}" stroke-width="1.4" stroke-opacity=".4" stroke-dasharray="4 3" marker-end="url(#df)"/>`;
        });
        s += `<rect x="${hx-34}" y="${H/2-17}" width="68" height="34" rx="8" fill="${sf}" stroke="${bd}"/>`;
        s += `<text x="${hx}" y="${H/2+4}" text-anchor="middle" font-size="11" fill="${tx}" font-family="ui-monospace,Menlo,monospace">one shape</text>`;
        s += `<text x="${rx}" y="${H-26}" text-anchor="end" font-size="11" fill="${mu}">replayed in the caller's own dialect</text>`;
        s += '</svg>';
        r.innerHTML = s + `<div class="nt">Solid lines in, dashed lines back out. Coding agents never converged on one API shape, so supporting all four is exactly what buys codex, claude-code and gemini-cli rather than only the chat-completions majority.</div>`;
      };
      draw();
      if ('ResizeObserver' in window) { let t; new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(draw,120);}).observe(r); }
      else window.addEventListener('resize', draw);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
</script>
