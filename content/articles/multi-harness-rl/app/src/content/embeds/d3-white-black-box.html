<div class="white-black-box" style="width:100%;margin:14px 0;"></div>

<style>
  .white-black-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-start;
    justify-content: center;
    min-height: 200px;
    padding: 28px 26px;
    border: 1px dashed var(--border-color);
    border-radius: 10px;
    background: color-mix(in oklab, var(--primary-color) 4%, transparent);
  }
  .white-black-box .ph-tag {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--primary-color);
  }
  .white-black-box .ph-title {
    font-size: 17px;
    font-weight: 650;
    color: var(--text-color);
  }
  .white-black-box .ph-desc {
    font-size: 14px;
    line-height: 1.5;
    max-width: 62ch;
    color: var(--muted-color);
  }
  .white-black-box .ph-file {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--muted-color);
    padding: 3px 7px;
    border: 1px solid var(--border-color);
    border-radius: 5px;
    background: var(--surface-bg);
  }
</style>

<script>
  (function () {
    function bootstrap() {
      var nodes = document.querySelectorAll('.white-black-box');
      for (var i = 0; i < nodes.length; i++) {
        var root = nodes[i];
        if (root.getAttribute('data-mounted')) continue;
        root.setAttribute('data-mounted', '1');
        root.innerHTML =
          '<div class="ph-tag">Visualization to build</div>' +
          '<div class="ph-title">Who drives the rollout</div>' +
          '<div class="ph-desc">Two architectures side by side. Left: trainer and environment in a closed loop. Right: trainer to sandbox, agent loop opaque.</div>' +
          '<div class="ph-file">d3-white-black-box.html</div>';
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  })();
</script>
