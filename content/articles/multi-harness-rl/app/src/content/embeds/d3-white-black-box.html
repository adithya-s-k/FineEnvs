<div class="white-black-box" style="width:100%;margin:14px 0;"></div>
<style>
  .white-black-box { position: relative; }
  .white-black-box svg { display:block; width:100%; height:auto; overflow:visible; }
  .white-black-box .lg { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font-size:12px; color:var(--muted-color); }
  .white-black-box .lg-t { width:100%; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  .white-black-box .k { display:inline-flex; align-items:center; gap:7px; }
  .white-black-box .sw { width:13px; height:3px; border-radius:2px; }
  .white-black-box .nt { margin-top:10px; font-size:12px; line-height:1.5; color:var(--muted-color); max-width:62ch; }
</style>
<script>
  (() => {
    const C = 'white-black-box';
    const boot = () => {
      const n = [...document.querySelectorAll('.'+C)].filter(e => e.dataset.mounted !== 'true');
      const r = n[n.length-1]; if (!r) return; r.dataset.mounted = 'true';
      const V = (k,f) => (getComputedStyle(r).getPropertyValue(k).trim() || f);
      const P = (i) => {
        if (window.ColorPalettes && window.ColorPalettes.categorical) {
          try { return window.ColorPalettes.categorical(4)[i%4]; } catch(e) {}
        }
        return ['rgb(78,165,183)','rgb(146,176,234)','rgb(206,192,250)','rgb(232,137,171)'][i%4];
      };
      const draw = () => {
        const W = Math.max(320, r.clientWidth);
        const bd = V('--border-color','rgba(128,128,128,.3)');
        const mu = V('--muted-color','rgba(128,128,128,.8)');
        const tx = V('--text-color','#16181d');
        const sf = V('--surface-bg','#fff');
        const H = Math.max(190, Math.round(W/3.6));
        const pw = (W-30)/2, c0 = P(0), c3 = P(3);
        const panel = (x, title, sub, accent, black) => {
          let g = `<rect x="${x}" y="24" width="${pw}" height="${H-64}" rx="12" fill="${sf}" stroke="${bd}"/>`;
          g += `<text x="${x+16}" y="46" font-size="11.5" fill="${mu}" font-family="ui-monospace,Menlo,monospace">${title}</text>`;
          const cy = 24+(H-64)/2+6, lx = x+34, rx2 = x+pw-34;
          g += `<rect x="${lx-26}" y="${cy-24}" width="62" height="48" rx="8" fill="none" stroke="${bd}"/>`;
          g += `<text x="${lx+5}" y="${cy+4}" text-anchor="middle" font-size="12" fill="${tx}">trainer</text>`;
          if (black) {
            const cid = 'clip'+Math.round(x);
            g += `<clipPath id="${cid}"><rect x="${rx2-62}" y="${cy-30}" width="76" height="60" rx="8"/></clipPath>`;
            g += `<rect x="${rx2-62}" y="${cy-30}" width="76" height="60" rx="8" fill="${accent}" fill-opacity="0.14" stroke="${accent}"/>`;
            g += `<g clip-path="url(#${cid})">`;
            for (let i=-4;i<10;i++) g += `<line x1="${rx2-62+i*9}" y1="${cy+30}" x2="${rx2-62+i*9+30}" y2="${cy-30}" stroke="${accent}" stroke-opacity=".28" stroke-width="1"/>`;
            g += `</g>`;
            g += `<text x="${rx2-24}" y="${cy+48}" text-anchor="middle" font-size="12" fill="${tx}">agent + sandbox</text>`;
            g += `<line x1="${lx+36}" y1="${cy}" x2="${rx2-64}" y2="${cy}" stroke="${accent}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
            g += `<text x="${(lx+36+rx2-64)/2}" y="${cy-10}" text-anchor="middle" font-size="11" fill="${mu}">one endpoint</text>`;
          } else {
            g += `<rect x="${rx2-56}" y="${cy-24}" width="70" height="48" rx="8" fill="none" stroke="${bd}"/>`;
            g += `<text x="${rx2-21}" y="${cy+4}" text-anchor="middle" font-size="12" fill="${tx}">env</text>`;
            g += `<path d="M ${lx+36} ${cy-9} L ${rx2-58} ${cy-9}" stroke="${accent}" stroke-width="1.6" marker-end="url(#a${x})"/>`;
            g += `<path d="M ${rx2-58} ${cy+9} L ${lx+36} ${cy+9}" stroke="${accent}" stroke-width="1.6" marker-end="url(#a${x})"/>`;
            g += `<text x="${(lx+36+rx2-58)/2}" y="${cy-16}" text-anchor="middle" font-size="11" fill="${mu}">step()</text>`;
            g += `<text x="${(lx+36+rx2-58)/2}" y="${cy+26}" text-anchor="middle" font-size="11" fill="${mu}">observation</text>`;
          }
          g += `<text x="${x+pw/2}" y="${H-22}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${tx}">${sub}</text>`;
          return g;
        };
        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="White-box and black-box environments compared by who owns the rollout loop">`;
        s += `<defs><marker id="a0" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="${c0}"/></marker></defs>`;
        s += panel(0, 'WHITE BOX', 'you drive it', c0, false).replace(/url\(#a0\)/g, 'url(#a0)');
        s += panel(pw+30, 'BLACK BOX', 'the agent drives it', c3, true);
        s += '</svg>';
        r.innerHTML = s + `<div class="nt">The difference is not the task, it is which side owns the loop. On the left every token the policy produced is already in the trainer's hands. On the right the trainer sees one thing: a sequence of calls arriving at an endpoint.</div>`;
      };
      draw();
      if ('ResizeObserver' in window) { let t; new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(draw,120);}).observe(r); }
      else window.addEventListener('resize', draw);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
</script>
