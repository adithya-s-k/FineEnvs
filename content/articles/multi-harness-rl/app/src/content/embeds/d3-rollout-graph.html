<div class="rollout-graph" style="width:100%;margin:14px 0;"></div>
<style>
  .rollout-graph { position: relative; }
  .rollout-graph svg { display:block; width:100%; height:auto; overflow:visible; }
  .rollout-graph .lg { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font-size:12px; color:var(--muted-color); }
  .rollout-graph .lg-t { width:100%; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  .rollout-graph .k { display:inline-flex; align-items:center; gap:7px; }
  .rollout-graph .sw { width:13px; height:3px; border-radius:2px; }
  .rollout-graph .nt { margin-top:10px; font-size:12px; line-height:1.5; color:var(--muted-color); max-width:62ch; }
</style>
<script>
  (() => {
    const C = 'rollout-graph';
    const boot = () => {
      const n = [...document.querySelectorAll('.'+C)].filter(e => e.dataset.mounted !== 'true');
      const r = n[n.length-1]; if (!r) return; r.dataset.mounted = 'true';
      const V = (k,f) => (getComputedStyle(r).getPropertyValue(k).trim() || f);
      const P = (i) => {
        if (window.ColorPalettes && window.ColorPalettes.categorical) {
          try { return window.ColorPalettes.categorical(4)[i%4]; } catch(e) {}
        }
        return ['rgb(78,165,183)','rgb(146,176,234)','rgb(206,192,250)','rgb(232,137,171)'][i%4];
      };
      const draw = () => {
        const W = Math.max(320, r.clientWidth);
        const bd = V('--border-color','rgba(128,128,128,.3)');
        const mu = V('--muted-color','rgba(128,128,128,.8)');
        const tx = V('--text-color','#16181d');
        const sf = V('--surface-bg','#fff');
        const H = Math.max(250, Math.round(W/2.7));
        const c0 = P(0), c3 = P(3);
        const N = [
          {id:0,x:.06,y:.34,r:1},{id:1,x:.22,y:.30,p:0},{id:2,x:.38,y:.36,p:1},
          {id:3,x:.54,y:.28,p:2},{id:4,x:.70,y:.33,p:3},{id:5,x:.86,y:.27,p:4},
          {id:6,x:.54,y:.52,p:2,d:1},{id:7,x:.66,y:.58,p:6,d:1},
          {id:8,x:.06,y:.80,r:1},{id:9,x:.24,y:.83,p:8},{id:10,x:.42,y:.78,p:9},
        ];
        const px = v => 34 + v*(W-90), py = v => 34 + v*(H-96);
        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="A rollout graph where turns link by exact token prefix, with one abandoned fork and a second root">`;
        N.forEach(n => {
          if (n.p === undefined) return;
          const q = N[n.p], c = n.d ? c3 : c0;
          s += `<path d="M ${px(q.x)} ${py(q.y)} C ${(px(q.x)+px(n.x))/2} ${py(q.y)}, ${(px(q.x)+px(n.x))/2} ${py(n.y)}, ${px(n.x)} ${py(n.y)}" fill="none" stroke="${c}" stroke-width="${n.d?1.1:1.9}" stroke-opacity="${n.d?.4:.85}" ${n.d?'stroke-dasharray="4 3"':''}/>`;
        });
        N.forEach(n => {
          const c = n.d ? c3 : c0;
          if (n.r) { s += `<rect x="${px(n.x)-5}" y="${py(n.y)-5}" width="10" height="10" rx="2" fill="${c0}"/>`; }
          else s += `<circle cx="${px(n.x)}" cy="${py(n.y)}" r="${n.d?3.4:5}" fill="${c}" fill-opacity="${n.d?.45:1}"/>`;
        });
        s += `<text x="${px(.06)}" y="${py(.34)-16}" font-size="11" fill="${mu}">root: system + first user turn</text>`;
        s += `<text x="${px(.66)+12}" y="${py(.58)+4}" font-size="11" fill="${c3}">resample, discarded</text>`;
        s += `<text x="${px(.06)}" y="${py(.80)-16}" font-size="11" fill="${mu}">second root: a subagent, its own system prompt</text>`;
        s += '</svg>';
        r.innerHTML = s +
          `<div class="lg"><div class="lg-t">Legend</div>` +
          `<span class="k"><span class="sw" style="background:${c0}"></span>a path from root to leaf is one training sequence</span>` +
          `<span class="k"><span class="sw" style="background:${c3};opacity:.5"></span>abandoned fork, excluded</span></div>` +
          `<div class="nt">Turns are linked by exact token prefix, not by request id or timestamp: a call whose prompt tokens begin with an existing node's full sequence becomes that node's child. Request ids and timestamps are per-harness; the prefix is not.</div>`;
      };
      draw();
      if ('ResizeObserver' in window) { let t; new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(draw,120);}).observe(r); }
      else window.addEventListener('resize', draw);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
</script>
