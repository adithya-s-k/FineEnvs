name: PortSimEnv on AgentEnv
on:
  pull_request:
    paths: ['07-simulation-environments/portsim-v1/envs/berth_planning/**', '07-simulation-environments/portsim-live/**',
            '.github/workflows/portsim.yml']
  push:
    branches: [main]
    paths: ['07-simulation-environments/portsim-v1/envs/berth_planning/**', '07-simulation-environments/portsim-live/**',
            '.github/workflows/portsim.yml']
permissions:
  contents: read
# portsim-live builds on portsim-v1's berth_core and dock-v1 weeks, so a change to either part can break the other; test
# both. No job builds the wind or lines weeks: that needs the Meteocat portal and about 50 minutes, so the tests on
# them skip here and run on the synthetic weeks instead. Run the builds by hand from
# 07-simulation-environments/portsim-live/envs/port_week:
#   uv run -p 3.12 --with ortools==9.15.6755 --with-editable core python tools/build_wind.py
#   uv run -p 3.12 --with ortools==9.15.6755 --with-editable core python tools/build_lines.py
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: berth_core, the grader both parts share
        run: uv run --frozen --project 07-simulation-environments/portsim-v1/envs/berth_planning/agentenv --extra dev pytest 07-simulation-environments/portsim-v1/envs/berth_planning/core/tests -q
      - name: PortSimEnv v1 on AgentEnv (no Docker, network or model keys)
        run: uv run --frozen --project 07-simulation-environments/portsim-v1/envs/berth_planning/agentenv --extra dev pytest 07-simulation-environments/portsim-v1/envs/berth_planning/agentenv/tests -q
      - name: port_week_core, the live week model (real-wind and lines cases skip until those weeks are built)
        run: uv run --frozen --project 07-simulation-environments/portsim-live/envs/port_week/agentenv --extra dev pytest 07-simulation-environments/portsim-live/envs/port_week/core/tests -q
      - name: PortSimEnv live on AgentEnv (no Docker, network or model keys)
        run: uv run --frozen --project 07-simulation-environments/portsim-live/envs/port_week/agentenv --extra dev pytest 07-simulation-environments/portsim-live/envs/port_week/agentenv/tests -q

  image:
    # The env images as agent-env deploys them: the same tests against containers, then each part's smoke run through
    # AgentEnv with no model (agent-env starts its own registry and gateway on the runner's Docker).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: 07-simulation-environments
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Build the v1 image (context envs/berth_planning)
        run: docker build -f portsim-v1/envs/berth_planning/agentenv/Dockerfile -t portsim-v1-agentenv portsim-v1/envs/berth_planning
      - name: Build the live image (context 07-simulation-environments)
        run: docker build -f portsim-live/envs/port_week/agentenv/Dockerfile -t portsim-live-agentenv .
      - name: Start the v1 env and wait for its card
        run: |
          docker run -d --name portsim-v1 -p 127.0.0.1:18765:18765 portsim-v1-agentenv
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:18765/.well-known/agent-env.json > /dev/null; do sleep 1; done' \
            || { docker logs portsim-v1; exit 1; }
      - name: v1 goldens, card, published transcripts, regrades, prompts and harness requests against the container
        env:
          PORTSIM_URL: http://127.0.0.1:18765
        run: >-
          uv run --frozen --project portsim-v1/envs/berth_planning/agentenv --extra dev pytest -q -m 'network or not network'
          portsim-v1/envs/berth_planning/agentenv/tests/golden
          portsim-v1/envs/berth_planning/agentenv/tests/replay
      - name: Stop the v1 env
        if: always()
        run: docker rm -f portsim-v1
      # With PORTSIM_LIVE_IMAGE the tests start one container per week (an env plays one week per deploy): the cards,
      # live, marine, wind and lines (the last two on fixture weeks) and the six recorded weeks replayed against the image.
      - name: Live, marine, wind and lines envs, cards and recorded weeks against containers of the live image
        env:
          PORTSIM_LIVE_IMAGE: portsim-live-agentenv
        run: uv run --frozen --project portsim-live/envs/port_week/agentenv --extra dev pytest -q portsim-live/envs/port_week/agentenv/tests
      # The smoke runs play without an agent, so build the agent images a real rollout deploys and import them:
      # portsim-llm, the planner, and portsim-line, the ships' agent of the lines weeks.
      - name: Build the portsim-llm and portsim-line agent images and import the agents
        run: |
          docker build -t portsim-llm portsim-v1/envs/berth_planning/agentenv/agent
          docker run --rm portsim-llm python -c "import sys; sys.path.insert(0, '/app'); import agent"
          docker build -t portsim-line portsim-v1/envs/berth_planning/agentenv/line_agent
          docker run --rm portsim-line python -c "import sys; sys.path.insert(0, '/app'); import agent"
      - name: v1 smoke through AgentEnv (scores 1.0, 0.176471 and 0)
        working-directory: 07-simulation-environments/portsim-v1/envs/berth_planning/agentenv
        run: uv run --frozen python rollout.py --smoke
      - name: Live smoke through AgentEnv (wiring-noplay scores 0 with the audit ok)
        working-directory: 07-simulation-environments/portsim-live/envs/port_week/agentenv
        run: uv run --frozen python rollout.py --smoke
      - name: Marine smoke through AgentEnv
        working-directory: 07-simulation-environments/portsim-live/envs/port_week/agentenv
        run: uv run --frozen python rollout.py --smoke --env marine
