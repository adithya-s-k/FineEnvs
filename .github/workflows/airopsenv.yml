name: AirOpsEnv on AgentEnv
on:
  pull_request:
    paths: ['07-simulation-environments/airopsenv/**', '.github/workflows/airopsenv.yml']
  push:
    branches: [main]
    paths: ['07-simulation-environments/airopsenv/**', '.github/workflows/airopsenv.yml']
permissions:
  contents: read
# The tests run on committed fixtures: four v1 days, three v2 dates and two v3 dates cut from the packs, the plugin's
# fixture days, a slice of the raw inputs, v3's survey extracts, a recorded run of each env and the task files the
# published runs played. So the test job needs neither the network nor the packs, and nothing in it skips. The five
# replays that take minutes (marked slow: three follower days and the recorded v2 and v3 days) run in the image job
# instead, which also fetches the packs from the dataset at v0.4.2 (21 MB, checked against the committed manifests),
# builds the env and agent images, replays the recorded v1 run and plays a v2 and a v3 day against containers of them,
# and plays the zero-spend days through AgentEnv.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 07-simulation-environments/airopsenv/envs/airops/agentenv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: airops_core, the three versions' days, references and passengers, and the pack builders on their slice
        run: uv run --frozen --extra dev pytest ../core/tests -q -rs
      - name: The three envs on AgentEnv, their task steps, the agents and the recorded v1 run (no Docker, network or keys)
        run: uv run --frozen --extra dev pytest tests -q -rs
      - name: Lint
        run: uv run --frozen --extra dev ruff check . ../core ../tools

  image:
    # The slow replays, then the env images as agent-env deploys them: the recorded v1 run, a v2 day and a v3 day
    # against containers, then the zero-spend days through AgentEnv with no model (agent-env starts its own registry
    # and gateway on the runner's Docker).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: airopsenv-image-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: 07-simulation-environments/airopsenv/envs/airops
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Fetch the packs from the dataset at v0.4.2 and check them against the committed manifests
        run: uv run -p 3.12 --with pyarrow python tools/fetch_packs.py
      - name: The slow replays (three follower days and the recorded v2 and v3 days, no Docker or network)
        run: uv run --frozen --project agentenv --extra dev pytest -q -rs -m slow agentenv/tests
      - name: Build the v1, v2 and v3 env images (context envs/airops)
        run: |
          docker build -f agentenv/Dockerfile -t airops-day-agentenv .
          docker build -f agentenv/Dockerfile.occ -t airops-occ-agentenv .
          docker build -f agentenv/Dockerfile.occ3 -t airops-occ3-agentenv .
      - name: The recorded v1 run against a container of the v1 image, and a v2 and a v3 day against theirs
        env:
          AIROPS_IMAGE: airops-day-agentenv
          AIROPS_OCC_IMAGE: airops-occ-agentenv
          AIROPS_OCC3_IMAGE: airops-occ3-agentenv
        run: >-
          uv run --frozen --project agentenv --extra dev pytest -q -rs
          agentenv/tests/env/test_recorded_runs.py agentenv/tests/occ/test_occ_server.py
          agentenv/tests/occ/test_occ3_server.py
      - name: Build the airops-llm and airops-desk agent images and import the agents
        run: |
          docker build -t airops-llm agentenv/agents/airops-llm
          docker run --rm airops-llm python -c "import sys; sys.path.insert(0, '/app'); import agent"
          docker build -t airops-desk agentenv/agents/airops-desk
          docker run --rm airops-desk python -c "import sys; sys.path.insert(0, '/app'); import agent"
      - name: v1 smoke through AgentEnv (wiring-noplay costs the naive day, the audit passing)
        working-directory: 07-simulation-environments/airopsenv/envs/airops/agentenv
        run: uv run --frozen python rollout.py --smoke
      - name: v2 smoke through AgentEnv (the crew system alone costs the idle reference)
        working-directory: 07-simulation-environments/airopsenv/envs/airops/agentenv
        run: uv run --frozen python rollout.py --env occ --smoke
      - name: v2 scripted desks through AgentEnv (both modes cost the pack's scripted references, no spend)
        working-directory: 07-simulation-environments/airopsenv/envs/airops/agentenv
        run: uv run --frozen python rollout.py --env occ --script --task-id b6-20250111-0400
      - name: v3 smoke through AgentEnv (the crew and passenger systems alone cost what the same day costs in process)
        working-directory: 07-simulation-environments/airopsenv/envs/airops/agentenv
        run: uv run --frozen python rollout.py --env occ3 --smoke
      - name: v3 scripted desks through AgentEnv (both modes cost what the agent's scripts cost in process, no spend)
        working-directory: 07-simulation-environments/airopsenv/envs/airops/agentenv
        run: uv run --frozen --extra dev python rollout.py --env occ3 --script --task-id b6-20250111-0400
