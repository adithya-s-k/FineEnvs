[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "berth-openenv"
version = "0.1.0"
description = "OpenEnv server for berth planning at the Port of Barcelona: MCP tools, rubric reward, 3D viewer, rollout harness"
requires-python = ">=3.11"
dependencies = [
    "berth-core",
    "openenv==0.7.0",
    "fastmcp>=3,<4",
    "gradio>=5",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
agents = ["openai>=1.55", "anthropic>=0.40", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "berth-core[solve]"]

[tool.uv.sources]
berth-core = { path = "../core", editable = true }

[tool.setuptools.packages.find]
include = ["berth_openenv*"]

[tool.setuptools.package-data]
berth_openenv = ["web/*", "web/**/*"]
