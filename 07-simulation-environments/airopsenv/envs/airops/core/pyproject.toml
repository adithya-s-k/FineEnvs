[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airops-core"
version = "0.3.3"
description = "JetBlue's storm days from public BTS, FAA and IEM records: v1's hub window and v2's whole network with crews, the FAA's programs, the references, the bounds and the grade"
requires-python = ">=3.11.4"
# v1's day (core/, day.py, schedule.py) needs only the standard library; v2, the references and the pack builders need
# these. highspy is pinned exactly: the references and best plans were proven with it.
dependencies = ["numpy>=2", "pandas>=2.2", "highspy==1.15.1", "airportsdata>=20260905"]

[project.optional-dependencies]
build = ["pyarrow>=17"]
dev = ["pytest>=8,<10", "pyarrow>=17"]

[tool.setuptools.packages.find]
include = ["airops_core*"]

[tool.setuptools.package-data]
"airops_core.programs" = ["crew_params.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads from public sources"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
