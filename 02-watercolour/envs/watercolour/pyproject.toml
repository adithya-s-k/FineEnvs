[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-watercolour-env"
version = "0.1.0"
description = "Watercolour environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv>=0.2.2",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.24.0",
    "requests>=2.31.0",
    # The submission is untrusted JavaScript and p5.brush needs a real WEBGL
    # context, so rendering runs in Chromium. The matching browser build is
    # installed in the image; see openenv/Dockerfile.
    "playwright==1.62.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    # Only needed when the vision judge is enabled.
    "huggingface-hub>=0.34.0",
    # Only needed when the dense term is served by an HPSv3 Space rather than by
    # the judge model. See [`watercolour_env.core.quality.HPSv3Scorer`].
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
server = "watercolour_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["watercolour_env", "watercolour_env.server", "watercolour_env.core"]
package-dir = { "watercolour_env" = ".", "watercolour_env.server" = "openenv", "watercolour_env.core" = "core" }

# The vendored p5 bundles are runtime data. Reference paintings are downloaded
# from the separately pinned dataset in core/pool.py.
[tool.setuptools.package-data]
"watercolour_env.server" = ["openenv.yaml"]
"watercolour_env.core" = ["vendor/*"]
