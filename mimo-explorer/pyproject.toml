[project]
name = "mimo-explorer"
version = "1.0.0"
description = "Browse, run and grade the MiMo-V2.6 RL environments on HF Sandboxes with HF Inference Providers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "huggingface_hub>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pypdf>=5",
    "pillow>=10",
    "langdetect>=1.0.9",
    "cryptography>=50.0.1",
]

[tool.uv]
package = false
